<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="600" height="840">
  <title>Anatomical heart (original vector illustration)</title>
  <defs>
    <radialGradient id="muscle" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f6b3aa"/>
      <stop offset="60%" stop-color="#e0857c"/>
      <stop offset="100%" stop-color="#b65a55"/>
    </radialGradient>
    <linearGradient id="aortaG" x1="0" x2="1">
      <stop offset="0%" stop-color="#d7263d"/><stop offset="100%" stop-color="#b0182e"/>
    </linearGradient>
    <clipPath id="heartClip">
      <path d="M140 262 C205 205 330 192 420 214 C505 236 572 292 578 385 C584 475 560 565 500 645 C440 725 330 795 228 808 C186 812 158 790 140 748 C100 668 70 560 76 460 C82 380 96 302 140 262 Z"/>
    </clipPath>
  </defs>

  <!-- Great vessels behind the heart -->
  <g id="superior-vena-cava">
    <path d="M488 250 L492 70" stroke="#2c6fa8" stroke-width="72" stroke-linecap="round" fill="none"/>
    <path d="M488 250 L492 70" stroke="#3f8fd2" stroke-width="58" stroke-linecap="round" fill="none"/>
    <ellipse cx="492" cy="70" rx="29" ry="12" fill="#245a88"/>
  </g>

  <g id="aorta">
    <g stroke-linecap="round" fill="none">
      <path d="M345 92 L335 28" stroke="#9e1428" stroke-width="34"/>
      <path d="M385 82 L392 18" stroke="#9e1428" stroke-width="30"/>
      <path d="M425 90 L450 34" stroke="#9e1428" stroke-width="28"/>
      <path d="M345 92 L335 28" stroke="#d7263d" stroke-width="24"/>
      <path d="M385 82 L392 18" stroke="#d7263d" stroke-width="20"/>
      <path d="M425 90 L450 34" stroke="#d7263d" stroke-width="18"/>
      <path d="M300 270 C285 160 320 85 395 88 C455 92 480 140 470 230" stroke="#9e1428" stroke-width="92"/>
      <path d="M300 270 C285 160 320 85 395 88 C455 92 480 140 470 230" stroke="url(#aortaG)" stroke-width="78"/>
      <path d="M296 220 C292 150 325 108 385 106" stroke="#ff6b78" stroke-width="10" opacity="0.6"/>
    </g>
  </g>

  <g id="pulmonary-trunk">
    <g stroke-linecap="round" fill="none">
      <path d="M270 285 C245 225 190 200 110 205" stroke="#5a3d8f" stroke-width="88"/>
      <path d="M270 285 C245 225 190 200 110 205" stroke="#7b57b8" stroke-width="74"/>
      <path d="M250 235 C215 218 170 214 120 218" stroke="#a585d9" stroke-width="10" opacity="0.6"/>
    </g>
    <ellipse cx="108" cy="205" rx="18" ry="36" fill="#4a2f78"/>
  </g>

  <g id="pulmonary-veins" stroke-linecap="round" fill="none">
    <path d="M150 315 L62 300" stroke="#b44a8c" stroke-width="40"/>
    <path d="M150 315 L62 300" stroke="#e070b4" stroke-width="30"/>
    <path d="M150 375 L72 388" stroke="#b44a8c" stroke-width="40"/>
    <path d="M150 375 L72 388" stroke="#e070b4" stroke-width="30"/>
    <path d="M520 255 L572 222" stroke="#b44a8c" stroke-width="40"/>
    <path d="M520 255 L572 222" stroke="#e070b4" stroke-width="30"/>
  </g>

  <!-- Heart muscle -->
