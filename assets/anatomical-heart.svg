    <path id="atrioventricular-groove" clip-path="url(#heartClip)" d="M86 425 C200 440 300 478 400 486 C470 492 530 496 576 505" fill="none" stroke="#b9615c" stroke-width="22" opacity="0.55" stroke-linecap="round"/>
    <path d="M150 300 C220 250 330 240 420 260" fill="none" stroke="#ffd2cb" stroke-width="14" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Opening of the inferior vena cava / coronary sinus -->
  <g id="inferior-vena-cava">
    <ellipse cx="432" cy="492" rx="58" ry="48" fill="#2c6fa8"/>
    <ellipse cx="432" cy="492" rx="46" ry="37" fill="#3f8fd2"/>
    <ellipse cx="440" cy="498" rx="30" ry="23" fill="#1f4f7a"/>
  </g>

  <!-- Coronary arteries (each path animatable with stroke-dashoffset) -->
  <g id="coronary-arteries" fill="none" stroke="#d7263d" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#heartClip)">
    <path id="artery-circumflex" d="M90 412 C200 428 300 466 398 474 C470 480 530 486 580 494" stroke-width="7"/>
    <path id="artery-descending" d="M330 468 C345 560 305 660 238 790" stroke-width="6"/>
    <path id="artery-marginal-left" d="M185 432 C155 520 132 610 120 720" stroke-width="5.5"/>
    <path id="artery-marginal-right" d="M500 488 C505 560 480 620 445 680" stroke-width="5"/>
    <g stroke-width="2.6">
      <path d="M330 520 C370 545 400 580 420 630"/>
      <path d="M320 600 C280 620 250 650 225 700"/>
      <path d="M300 680 C330 700 345 730 350 770"/>
      <path d="M160 520 C130 540 110 560 92 600"/>
      <path d="M140 620 C165 650 175 690 180 740"/>
      <path d="M490 560 C520 580 545 590 568 590"/>
      <path d="M250 455 C240 380 260 320 300 280"/>
      <path d="M200 440 C170 380 160 330 170 280"/>
      <path d="M420 476 C440 410 470 360 520 330"/>
      <path d="M520 488 C540 440 560 410 575 395"/>
    </g>
  </g>

  <!-- Cardiac veins -->
  <g id="cardiac-veins" fill="none" stroke="#3f8fd2" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#heartClip)">
    <path id="vein-great-cardiac" d="M95 432 C200 452 290 488 378 496" stroke-width="9"/>
    <path id="vein-middle-cardiac" d="M372 520 C380 610 340 700 270 805" stroke-width="7"/>
    <path id="vein-posterior" d="M175 448 C150 540 128 630 118 740" stroke-width="6"/>
    <g stroke-width="3">
      <path d="M368 600 C400 630 420 670 432 720"/>
      <path d="M345 680 C310 700 290 730 280 770"/>
      <path d="M150 560 C120 580 100 610 90 650"/>
      <path d="M135 660 C160 690 168 720 170 760"/>
      <path d="M240 470 C230 400 250 340 280 300"/>
    </g>
  </g>
</svg>
