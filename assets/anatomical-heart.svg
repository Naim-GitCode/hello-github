      <path d="M222 200 C162 380 62 560 -48 830"/>
      <path d="M264 200 C204 380 104 560 -6 830"/>
      <path d="M306 200 C246 380 146 560 36 830"/>
      <path d="M348 200 C288 380 188 560 78 830"/>
      <path d="M390 200 C330 380 230 560 120 830"/>
      <path d="M432 200 C372 380 272 560 162 830"/>
      <path d="M474 200 C414 380 314 560 204 830"/>
      <path d="M516 200 C456 380 356 560 246 830"/>
      <path d="M558 200 C498 380 398 560 288 830"/>
      <path d="M600 200 C540 380 440 560 330 830"/>
      <path d="M642 200 C582 380 482 560 372 830"/>
      <path d="M684 200 C624 380 524 560 414 830"/>
      <path d="M726 200 C666 380 566 560 456 830"/>
      <path d="M768 200 C708 380 608 560 498 830"/>
      <path d="M810 200 C750 380 650 560 540 830"/>
      <path d="M60 520 C200 470 380 480 600 530" opacity="0.6"/>
      <path d="M60 565 C200 515 380 525 600 575" opacity="0.6"/>
      <path d="M60 610 C200 560 380 570 600 620" opacity="0.6"/>
      <path d="M60 655 C200 605 380 615 600 665" opacity="0.6"/>
      <path d="M60 700 C200 650 380 660 600 710" opacity="0.6"/>
      <path d="M60 745 C200 695 380 705 600 755" opacity="0.6"/>
